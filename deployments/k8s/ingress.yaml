apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paqtra
  namespace: cilium-system
  labels:
    app: paqtra
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/websocket-services: "paqtra-api"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - paqtra.example.com
    secretName: paqtra-tls
  rules:
  - host: paqtra.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: paqtra-api
            port:
              number: 9191
      - path: /
        pathType: Prefix
        backend:
          service:
            name: paqtra-ui
            port:
              number: 8080

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Core TUI Crate ───────────────────────────────────────────────────
  check:
    name: Check (TUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo check --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --all-features -- -D warnings

  test:
    name: Test (TUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test --all-features

  build:
    name: Build (TUI)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: paqtra-${{ matrix.os }}
          path: target/release/paqtra${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  cli-smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: paqtra-ubuntu-latest
          path: target/release
      - name: Fix binary permissions
        run: chmod +x target/release/paqtra
      - name: CLI smoke
        run: bash scripts/ci-cli-smoke.sh
        env:
          PAQTRA_BIN: ${{ github.workspace }}/target/release/paqtra

  chart-lint:
    name: Chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: Helm lint + template
        run: bash scripts/ci-chart-smoke.sh

  investigate-golden:
    name: Investigate golden (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Offline investigate contracts
        run: bash scripts/ci-investigate-golden.sh

  packet-visibility:
    name: Packet visibility (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Offline packet-visibility contracts
        run: bash scripts/ci-packet-visibility.sh

  installer:
    name: install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          shellcheck -s sh install.sh
          shellcheck scripts/ci-install-sh.sh scripts/render-homebrew-formula.sh scripts/dev-install.sh
      - name: Installer refuses tampered, unlisted and unverified downloads
        run: bash scripts/ci-install-sh.sh

  agent-image:
    name: Agent Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build agent/CLI image
        run: docker build -f Dockerfile -t paqtra:ci .
        # Full Rust image build is heavy; keep the job but don't block the PR merge path on transient registry issues.
        continue-on-error: true

  # ─── Web API ───────────────────────────────────────────────────────────
  web-api-check:
    name: Check (Web API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-api
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web-api
      - run: cargo check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      # Metrics platform crate shared by the agent and the API.
      - run: cargo fmt --manifest-path paqtra-metrics/Cargo.toml -- --check
      - run: cargo clippy --manifest-path paqtra-metrics/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path paqtra-metrics/Cargo.toml

  # ─── Web UI ────────────────────────────────────────────────────────────
  web-ui-build:
    name: Build (Web UI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx vitest run
      - name: NPM audit
        run: npm audit --audit-level=high

  # ─── Docs Site ──────────────────────────────────────────────────────────
  website:
    name: Build (Docs site)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm --prefix website ci
      - run: npm --prefix website run build

  # ─── Security Scanning ──────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cargo audit
        run: cargo install cargo-audit && cargo audit

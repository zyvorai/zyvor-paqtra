# Example CiliumNetworkPolicy: Database access control
# Allow only API pods to access PostgreSQL database
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: api-db-access
  namespace: production
  annotations:
    paqtra.io/generated: "true"
    paqtra.io/confidence: "92.3"
    paqtra.io/learning-duration: "14d"
spec:
  endpointSelector:
    matchLabels:
      app: postgresql
      tier: database
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: api
        tier: backend
        env: production
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  # No ingressDeny here: once an ingress rule selects this endpoint, Cilium
  # already drops all other ingress, and deny rules take precedence over
  # allow rules (a wildcard deny would block the API pods too).

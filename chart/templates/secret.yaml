apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paqtra.fullname" . }}-secret
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "paqtra.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" (include "paqtra.fullname" .))) -}}
  {{- if .Values.auth.jwtSecret }}
  JWT_SECRET: {{ .Values.auth.jwtSecret | b64enc | quote }}
  {{- else if .Values.api.env.jwtSecret }}
  JWT_SECRET: {{ .Values.api.env.jwtSecret | b64enc | quote }}
  {{- else }}
  JWT_SECRET: {{ if $existingSecret }}{{ index $existingSecret.data "JWT_SECRET" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  {{- end }}
  ADMIN_USERNAME: {{ (.Values.auth.adminUsername | default "admin") | b64enc | quote }}
  {{- if .Values.auth.adminPassword }}
  ADMIN_PASSWORD: {{ .Values.auth.adminPassword | b64enc | quote }}
  {{- else }}
  ADMIN_PASSWORD: {{ if $existingSecret }}{{ index $existingSecret.data "ADMIN_PASSWORD" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
  {{- end }}
  {{- if .Values.auth.apiKey }}
  API_KEY: {{ .Values.auth.apiKey | b64enc | quote }}
  {{- else }}
  API_KEY: {{ if $existingSecret }}{{ index $existingSecret.data "API_KEY" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
  {{- end }}
  {{- if .Values.auth.agentKey }}
  PAQTRA_AGENT_KEY: {{ .Values.auth.agentKey | b64enc | quote }}
  {{- else }}
  PAQTRA_AGENT_KEY: {{ if and $existingSecret (index $existingSecret.data "PAQTRA_AGENT_KEY") }}{{ index $existingSecret.data "PAQTRA_AGENT_KEY" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  {{- end }}

{{- if .Values.gateway.enabled }}
{{- if not .Values.gateway.parentRefs }}
{{- fail "gateway.enabled needs gateway.parentRefs (the Envoy Gateway / Gateway API Gateway to attach to)" }}
{{- end }}
{{- $bt := .Values.gateway.backendTLS | default dict }}
{{- $needBackendTLS := and .Values.tls.enabled $bt.enabled }}
{{- if and .Values.tls.enabled (not $bt.enabled) }}
{{- fail "tls.enabled=true serves the UI over HTTPS from the pod; set gateway.backendTLS.enabled=true (with a CA) or tls.enabled=false behind a trusted gateway" }}
{{- end }}
{{- if and $needBackendTLS (not $bt.caCertificateRefs) (not $bt.wellKnownCACertificates) }}
{{- fail "gateway.backendTLS needs caCertificateRefs or wellKnownCACertificates so Envoy can verify the UI pod certificate; the self-signed init-container cert cannot be verified, so use tls.enabled=false behind the gateway" }}
{{- end }}
{{- $ns := .Values.global.namespace | default .Release.Namespace }}
# Envoy (via Gateway API) in front of the Paqtra UI and API. Optional: Paqtra's
# own auth (JWT, API key) is unchanged; the gateway adds TLS termination,
# routing and edge policy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "paqtra.fullname" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "paqtra.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
  - matches:
    {{- range .Values.gateway.apiPaths }}
    - path:
        type: PathPrefix
        value: {{ . | quote }}
    {{- end }}
    # Streams (flows, metrics) are long-lived; "0s" disables the per-request
    # timeout so Envoy does not cut them.
    timeouts:
      request: {{ .Values.gateway.requestTimeout | default "0s" | quote }}
    backendRefs:
    - name: {{ include "paqtra.fullname" . }}-api
      port: {{ .Values.api.service.port }}
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.gateway.uiPath | quote }}
    timeouts:
      request: {{ .Values.gateway.requestTimeout | default "0s" | quote }}
    backendRefs:
    - name: {{ include "paqtra.fullname" . }}-ui
      port: {{ .Values.ui.service.port }}
{{- if $needBackendTLS }}
---
apiVersion: {{ default "gateway.networking.k8s.io/v1alpha3" $bt.apiVersion }}
kind: BackendTLSPolicy
metadata:
  name: {{ include "paqtra.fullname" . }}-ui
  namespace: {{ $ns }}
  labels:
    {{- include "paqtra.labels" . | nindent 4 }}
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: {{ include "paqtra.fullname" . }}-ui
  validation:
    hostname: {{ default (printf "%s-ui.%s.svc" (include "paqtra.fullname" .) $ns) $bt.hostname | quote }}
    {{- with $bt.caCertificateRefs }}
    caCertificateRefs:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $bt.wellKnownCACertificates }}
    wellKnownCACertificates: {{ . | quote }}
    {{- end }}
{{- end }}
{{- with .Values.gateway.backendTrafficPolicy }}
{{- if .enabled }}
---
# Envoy Gateway extension (needs its CRDs). With backend TLS Envoy negotiates
# HTTP/2 to the UI pod, which cannot carry a WebSocket upgrade;
# useClientProtocol keeps the upstream hop on the client's HTTP version.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "paqtra.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "paqtra.labels" $ | nindent 4 }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "paqtra.fullname" $ }}
  useClientProtocol: {{ .useClientProtocol }}
{{- end }}
{{- end }}
{{- end }}
